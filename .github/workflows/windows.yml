name: Crear programa para Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crear-programa:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements-build.txt
      - name: Probar conversion y proteccion de archivos
        run: python -m unittest discover -s tests -v
      - name: Verificar interfaz y boton del Generador
        run: python tests/ui_windows.py
      - name: Crear ejecutable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name El_todo_poderOSO --icon assets/app.ico --collect-data reportlab --add-data "tools:tools" --add-data "assets:assets" app.py
      - name: Probar ejecutable completo en Windows
        run: python tests/smoke_windows.py dist/El_todo_poderOSO.exe
      - name: Guardar programa descargable
        uses: actions/upload-artifact@v4
        with:
          name: El_todo_poderOSO_Windows
          path: dist/El_todo_poderOSO.exe
          if-no-files-found: error
          retention-days: 30
      - name: Guardar vista del programa
        uses: actions/upload-artifact@v4
        with:
          name: Vista_El_todo_poderOSO
          path: Vista_El_todo_poderOSO.png
          retention-days: 7
